[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stresskit-demo"
version = "0.4.0"
description = "Demo of a wearable stress-detection backend: mock PPG/ACC, a Python SDK and an HTTPS API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The AWS backend (STRESSKIT_BACKEND=aws). The local demo does not need it.
aws = ["boto3>=1.34"]
# moto is a local stand-in for AWS, so the AWS tests need no account or credentials.
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "boto3>=1.34",
    "moto[server,s3,dynamodb,ssm]>=5.0",
    "cfn-lint>=1.0",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Form"]
